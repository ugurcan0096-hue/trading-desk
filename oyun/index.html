<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0920">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orbit Dash">
  <meta name="description" content="One-tap space game: switch orbits, dodge meteors, collect gems.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Orbit Dash</title>
  <style>
    :root { --text: #f3f1ff; --muted: #a9a3d6; --gold: #ffd84d; --cyan: #7cf2ff; --bg: #0b0920; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; display: block; }
    .hide { display: none !important; }
    .layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; pointer-events: none; }
    .layer button, .layer input, .layer .panel { pointer-events: auto; }
    h1 { margin: 0; font-size: clamp(44px, 13vw, 76px); letter-spacing: -0.03em; font-weight: 900;
      background: linear-gradient(180deg, #fff, #b8a4ff); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 6px 24px rgba(140,110,255,.45)); }
    .sub { color: var(--muted); font-size: 15px; max-width: 300px; line-height: 1.45; }
    .btn { font: 800 20px/1 inherit; font-family: inherit; color: #120c2e; background: linear-gradient(180deg, #ffe680, #ffc93d); border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer; box-shadow: 0 8px 30px rgba(255,216,77,.35); }
    .btn:active { transform: scale(.96); }
    .btn.ghost { background: rgba(255,255,255,.1); color: var(--text); box-shadow: none; font-size: 16px; padding: 12px 20px; }
    #menu, #over { padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
    .spacer { height: 30vh; }
    #menu .spacer { height: 34vh; }
    .big { font-size: clamp(64px, 20vw, 110px); font-weight: 900; line-height: 1; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    #hud { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; pointer-events: none; }
    #score { font-size: 54px; font-weight: 900; text-shadow: 0 4px 24px rgba(124,242,255,.35); display: inline-block; }
    #score.pop { animation: pop .18s ease-out; }
    @keyframes pop { 50% { transform: scale(1.18); } }
    #best, #level { color: var(--muted); font-size: 13px; font-weight: 700; }
    #level { color: var(--cyan); }
    #mute { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); font-size: 18px; color: #fff; cursor: pointer; }
    .newbest { color: var(--gold); font-weight: 900; font-size: 18px; letter-spacing: .04em; animation: glow 1s ease-in-out infinite alternate; }
    @keyframes glow { to { text-shadow: 0 0 18px rgba(255,216,77,.8); } }
    .unlock { color: #7dffb0; font-weight: 800; font-size: 14px; }
    .hint { color: var(--muted); font-size: 13px; }
    /* skins */
    .skins { display: flex; gap: 8px; }
    .skin { background: rgba(255,255,255,.07); border: 2px solid transparent; border-radius: 14px; padding: 8px 8px 6px; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 62px; cursor: pointer; font-family: inherit; }
    .skin.on { border-color: var(--gold); background: rgba(255,216,77,.12); }
    .skin.locked { opacity: .55; }
    .skin .sw { width: 22px; height: 22px; border-radius: 50%; display: block; }
    .skin small { font-size: 11px; font-weight: 700; }
    .shake { animation: shk .35s; }
    @keyframes shk { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    /* leaderboard */
    .panel { background: rgba(20,16,48,.92); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 12px 14px; width: min(340px, 92vw); backdrop-filter: blur(8px); text-align: left; }
    .panel h2 { margin: 2px 0 8px; font-size: 18px; text-align: center; }
    .brow { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 10px; }
    .brow + .brow { border-top: 1px solid rgba(255,255,255,.06); }
    .brow.me { background: rgba(255,216,77,.16); }
    .brow .rk { width: 26px; text-align: center; font-weight: 800; color: var(--muted); }
    .brow .nm { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .brow .sc { font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); text-align: center; padding: 10px; font-size: 14px; }
    .namebox { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .namebox input { width: min(260px, 80vw); font: 700 18px inherit; font-family: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid rgba(255,216,77,.6); background: rgba(0,0,0,.35); color: #fff; text-align: center; user-select: text; -webkit-user-select: text; outline: none; }
    #over .board-wrap { max-height: 34vh; overflow-y: auto; }
    .btn.revive { background: linear-gradient(180deg, #8cffc1, #34d36b); box-shadow: 0 8px 30px rgba(52,211,107,.35); }
    .btn:disabled { opacity: .7; }
    .langwrap { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
    .langwrap select { background: transparent; color: var(--text); border: 0; font: 600 15px inherit; font-family: inherit; outline: none; }
    .langwrap option { background: #1a1440; color: #fff; }
    #board { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(4,3,12,.6); }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="menu" class="layer">
    <h1 data-i18n="title">Orbit Dash</h1>
    <div class="sub" data-i18n="sub">Tap to jump between the inner and outer orbit. Dodge meteors, collect gems!</div>
    <div class="spacer"></div>
    <button id="play" class="btn" data-i18n="play">▶ Play</button>
    <div id="menuBest" class="hint"></div>
    <div id="skins" class="skins"></div>
    <div class="row">
      <button id="openBoard" class="btn ghost" data-i18n="leaderboard">🏆 Top Players</button>
      <button id="install" class="btn ghost hide" data-i18n="install">📲 Install</button>
    </div>
    <div class="row">
      <label class="langwrap">🌐 <select id="lang" aria-label="Language"></select></label>
    </div>
  </div>

  <div id="hud" class="hide"><div id="score">0</div><div id="best"></div><div id="level"></div></div>

  <div id="over" class="layer hide">
    <div class="hint" data-i18n="score">SCORE</div>
    <div id="final" class="big">0</div>
    <div id="newBest" class="newbest hide" data-i18n="newRecord">★ NEW RECORD ★</div>
    <div class="hint"><span data-i18n="best">Best:</span> <b id="finalBest">0</b></div>
    <div id="unlock" class="unlock hide"></div>
    <div id="nameBox" class="namebox panel hide">
      <h2 data-i18n="madeBoard">🏆 You made the Top 10!</h2>
      <input id="nameInput" type="text" maxlength="14" placeholder="Enter your name" data-i18n-ph="namePh" autocomplete="nickname" enterkeyhint="done">
      <button id="saveName" class="btn" data-i18n="save">Save</button>
    </div>
    <div class="board-wrap panel" id="overBoardWrap"><h2 data-i18n="leaderboard">🏆 Top Players</h2><div id="overBoard"></div></div>
    <button id="revive" class="btn revive hide">📺 Watch an ad to continue</button>
    <div class="row"><button id="again" class="btn" data-i18n="again">↻ Again</button><button id="share" class="btn ghost" data-i18n="share">Share</button><button id="toMenu" class="btn ghost" data-i18n="menu">Menu</button></div>
  </div>

  <div id="board" class="hide"><div class="panel"><h2 data-i18n="leaderboard">🏆 Top Players</h2><div id="boardList"></div><div class="row" style="margin-top:10px"><button id="closeBoard" class="btn ghost" data-i18n="close">Close</button></div></div></div>

  <button id="mute" aria-label="Sound">🔊</button>
  <script src="i18n.js?v=2"></script>
  <script src="platform.js?v=2"></script>
  <script src="game.js?v=8"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!hadController || reloaded) return;
        reloaded = true; location.reload();
      });
      navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" }).then(function (r) {
        try { var p = r.update(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      }).catch(function () {});
    }
  </script>
</body>
</html>
